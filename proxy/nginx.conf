# Única puerta de entrada: reparte por ruta. Ningún otro servicio publica puertos.
server {
    listen 80;
    client_max_body_size 10m;   # fotos

    # Backend del P1 (FastAPI). Sin "/" al final de proxy_pass => CONSERVA el prefijo /api
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Servicio Elixir (P2). Conserva el prefijo /f
    location /f/ {
        proxy_pass http://funcional:4000;
        proxy_set_header Host $host;
    }

    # Frontend (estático)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
